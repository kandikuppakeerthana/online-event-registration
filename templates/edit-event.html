{% extends "base.html" %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <span class="section-label">ADMIN PANEL</span>
            <h1>Edit Event</h1>
            <p>Update the details of this event.</p>
        </div>

        <form method="POST" class="auth-form">

            <div class="form-group">
                <label for="title">Event Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ event['title'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    required
                >{{ event['description'] }}</textarea>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="date">Date</label>
                    <input
                        type="date"
                        id="date"
                        name="date"
                        value="{{ event['date'] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="time">Time</label>
                    <input
                        type="text"
                        id="time"
                        name="time"
                        value="{{ event['time'] }}"
                        required
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="venue">Venue</label>
                <input
                    type="text"
                    id="venue"
                    name="venue"
                    value="{{ event['venue'] }}"
                    required
                >
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="category">Category</label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                        value="{{ event['category'] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="capacity">Capacity</label>
                    <input
                        type="number"
                        id="capacity"
                        name="capacity"
                        min="1"
                        value="{{ event['capacity'] }}"
                        required
                    >
                </div>

            </div>

            <button type="submit" class="btn btn-primary btn-full">
                <i class="fas fa-save"></i>
                Update Event
            </button>

            <a href="{{ url_for('admin') }}" class="auth-link">
                ← Back to Admin Dashboard
            </a>

        </form>

    </div>
</section>

{% endblock %}
